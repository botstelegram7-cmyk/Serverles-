name: Validate project files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate JSON and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package manifests
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('Serena-Group-Manager/package.json', 'utf8'))"

      - name: Check deployed JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find tgcloud Serena-Group-Manager/tgcloud -type f -name '*.js' -print0)
